<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sunflowerCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c0d02"/>
      <stop offset="60%" stop-color="#3d1704"/>
      <stop offset="85%" stop-color="#712b08"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="sunflowerPetalBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sunflowerPetalFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <style>
      @keyframes spinFavicon {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .spinning-sunflower {
        transform-origin: 50px 50px;
        animation: spinFavicon 8s linear infinite;
      }
    </style>
  </defs>

  <g class="spinning-sunflower">
